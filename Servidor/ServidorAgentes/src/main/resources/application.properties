server.port=8081
spring.application.name=ServidorAgentes

# MongoDB (base de datos NO relacional). Base: agentes_inteligentes_db
# Colecciones: agentes_inteligentes (maestro) y agentes_navegacion (detalle)
spring.data.mongodb.uri=mongodb://localhost:27017/agentes_inteligentes_db?serverSelectionTimeoutMS=5000
spring.data.mongodb.auto-index-creation=true

# GraphQL
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=true
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-methods=GET,POST

# Datos de prueba masivos: pongan por ejemplo 5000 para generar 5000 agentes inteligentes
# y 10000 agentes de navegacion (una sola vez) y demostrar la paginacion. 0 = desactivado.
datos.prueba.masivos=0
